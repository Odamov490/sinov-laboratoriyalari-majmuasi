services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slm_user
      POSTGRES_PASSWORD: 9KjG1MuYCoYwEhHjLPzvElSx
      POSTGRES_DB: slm_db
    ports:
      - '5432:5432'
    volumes:
      - slm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slm_user -d slm_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://slm_user:9KjG1MuYCoYwEhHjLPzvElSx@postgres:5432/slm_db?schema=public
      JWT_SECRET: 33b5bd0a18b5edbaa211c467141b2c38b68aa56b296999ce116b25798bfdfb8b
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: production
      CLIENT_URL: https://s-lab.uz
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 200
      LOGIN_EMAIL_DOMAIN: ${LOGIN_EMAIL_DOMAIN:-slm.uz}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CHAT_STORAGE_DIR: ${CHAT_STORAGE_DIR:-/app/chat-media}
      # OnlyOffice (SMK shablonlarini onlayn tahrirlash). Qiymat ildizdagi .env faylida.
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
      - '5555:5555'
    volumes:
      - slm_uploads:/app/uploads
      # Chat media (alohida volume, ommaga statik berilmaydi) — zaxira nusxaga kiriting!
      - slm_chat_media:/app/chat-media

  # Onlayn ofis muharriri (Word/Excel). Tashqariga port ochilmaydi — faqat
  # frontend nginx orqali /onlyoffice/ yo'lida.
  # Vaqtincha O'CHIQ (RAM yetmaydi: rasmiy talab alohida 4 GB RAM, 40 GB disk).
  # Oddiy "docker compose up -d" uni ishga tushirmaydi. Yoqish:
  #   docker compose --profile office up -d
  onlyoffice:
    image: onlyoffice/documentserver:8.2.2
    profiles: ['office']
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      JWT_IN_BODY: 'true'
      # Faylni ichki tarmoqdagi backend'dan yuklab olishga ruxsat.
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
    volumes:
      - slm_onlyoffice_data:/var/www/onlyoffice/Data
      - slm_onlyoffice_lib:/var/lib/onlyoffice
      - slm_onlyoffice_logs:/var/log/onlyoffice

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  slm_postgres_data:
  slm_uploads:
  slm_chat_media:
  slm_onlyoffice_data:
  slm_onlyoffice_lib:
  slm_onlyoffice_logs: