services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slm_user
      POSTGRES_PASSWORD: 9KjG1MuYCoYwEhHjLPzvElSx
      POSTGRES_DB: slm_db
    ports:
      - '5432:5432'
    volumes:
      - slm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slm_user -d slm_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://slm_user:9KjG1MuYCoYwEhHjLPzvElSx@postgres:5432/slm_db?schema=public
      JWT_SECRET: 33b5bd0a18b5edbaa211c467141b2c38b68aa56b296999ce116b25798bfdfb8b
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: production
      CLIENT_URL: https://s-lab.uz
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 200
      LOGIN_EMAIL_DOMAIN: ${LOGIN_EMAIL_DOMAIN:-slm.uz}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CHAT_STORAGE_DIR: ${CHAT_STORAGE_DIR:-/app/chat-media}
      # Tris integratsiyasi (OAuth 2.0 + PKCE). Qiymatlar serverdagi ildiz .env'da;
      # bo'sh bo'lsa integratsiya "sozlanmagan" holatida, ilova ishlayveradi.
      TRIS_API_BASE_URL: ${TRIS_API_BASE_URL:-https://api-laboratory.tris.uz}
      TRIS_OAUTH_AUTHORIZE_URL: ${TRIS_OAUTH_AUTHORIZE_URL:-}
      TRIS_OAUTH_TOKEN_URL: ${TRIS_OAUTH_TOKEN_URL:-}
      TRIS_OAUTH_REVOKE_URL: ${TRIS_OAUTH_REVOKE_URL:-}
      TRIS_OAUTH_USERINFO_URL: ${TRIS_OAUTH_USERINFO_URL:-}
      TRIS_OAUTH_CLIENT_ID: ${TRIS_OAUTH_CLIENT_ID:-}
      TRIS_OAUTH_CLIENT_SECRET: ${TRIS_OAUTH_CLIENT_SECRET:-}
      TRIS_OAUTH_TOKEN_AUTH_METHOD: ${TRIS_OAUTH_TOKEN_AUTH_METHOD:-client_secret_basic}
      TRIS_OAUTH_SCOPES: ${TRIS_OAUTH_SCOPES:-}
      TRIS_OAUTH_REDIRECT_URI: ${TRIS_OAUTH_REDIRECT_URI:-https://s-lab.uz/api/tris/callback}
      TRIS_OAUTH_PKCE: ${TRIS_OAUTH_PKCE:-true}
      TRIS_TOKEN_ENCRYPTION_KEY: ${TRIS_TOKEN_ENCRYPTION_KEY:-}
      TRIS_API_PING_PATH: ${TRIS_API_PING_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
      - '5555:5555'
    volumes:
      - slm_uploads:/app/uploads
      # Chat media (alohida volume, ommaga statik berilmaydi) — zaxira nusxaga kiriting!
      - slm_chat_media:/app/chat-media

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  slm_postgres_data:
  slm_uploads:
  slm_chat_media: