server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200M;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200M;
    }

    # Chat media: imzolangan havola, Range so'rovlar; katta video/audio
    # buferlanmasdan to'g'ridan-to'g'ri oqim bilan uzatiladi.
    location ^~ /api/chat/media/ {
        proxy_pass http://backend:4000/api/chat/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Chat real vaqt (Socket.IO): WebSocket upgrade, polling zaxira.
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:4000/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Hash'li build fayllari (Vite: /assets/index-AbC123.js) — nomi o'zgarmaguncha
    # mazmuni ham o'zgarmaydi, shuning uchun 1 yil keshlanadi. Yo'q fayl uchun
    # index.html EMAS, haqiqiy 404 qaytariladi (aks holda HTML JS sifatida
    # keshlanib qolardi). add_header faqat 200/304 javoblarga qo'shiladi.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html har safar serverdan tekshiriladi (ETag/304), shunda deploy'dan
    # keyin brauzer yangi fayl nomlarini darhol oladi. SPA fallback (try_files
    # ... /index.html) va "/" ham ichki yo'naltirish orqali shu yerga tushadi.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}