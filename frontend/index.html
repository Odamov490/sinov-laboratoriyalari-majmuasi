<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Only the <title> stays static here (harmless: the browser enforces a
      single <title> element, so react-helmet-async can safely replace its
      text). The description/OG/twitter tags are owned entirely by
      react-helmet-async (PublicLayout renders a sitewide default <SEO/>,
      overridden per-page by each page's own <SEO/>) — react-helmet-async
      does not remove tags it did not render itself, so a static
      <meta name="description"> etc. here would end up duplicated
      alongside the JS-rendered one rather than replaced.
    -->
    <title>Sinov Laboratoriyalari Majmuasi</title>
    <meta property="og:locale" content="uz_UZ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
